<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامه تمرین</title>
<meta name="theme-color" content="#ECEEF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="تمرین">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEF2; --surface:#FFFFFF; --ink:#171B26; --muted:#5E6677; --line:#D5D9E1;
  --track:#E3E6EC; --range:#C9CED8; --low:#7C8496; --good:#1F7A4D; --warn:#9A5B00; --warn-bg:#FFF4DC;
  --p1:#C2342B; --p2:#2A5DB5; --p3:#C99412; --p4:#2C8656;
  --acc:var(--p1); --on-acc:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12141A; --surface:#1C1F28; --ink:#EEF0F5; --muted:#9AA2B3; --line:#2E3340;
    --track:#2A2E3A; --range:#454B5B; --low:#8D95A8; --good:#5FCB93; --warn:#F0BC5E; --warn-bg:#33290F;
    --p1:#E5564C; --p2:#5B8FE8; --p3:#E6B53A; --p4:#4FB980;
  }
}
:root[data-theme="dark"]{
  --bg:#12141A; --surface:#1C1F28; --ink:#EEF0F5; --muted:#9AA2B3; --line:#2E3340;
  --track:#2A2E3A; --range:#454B5B; --low:#8D95A8; --good:#5FCB93; --warn:#F0BC5E; --warn-bg:#33290F;
  --p1:#E5564C; --p2:#5B8FE8; --p3:#E6B53A; --p4:#4FB980;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.7;
  font-variant-numeric:tabular-nums}
body[data-day="1"]{--acc:var(--p1);--on-acc:#fff}
body[data-day="2"]{--acc:var(--p2);--on-acc:#fff}
body[data-day="3"]{--acc:var(--p3);--on-acc:#1B1500}
body[data-day="4"]{--acc:var(--p4);--on-acc:#fff}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  border-bottom:1px solid var(--line);padding:10px 0 0}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{border:0;background:transparent;padding:6px 2px 9px;border-bottom:4px solid transparent;
  display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.35;color:var(--muted)}
.tab small{font-size:12px}
.tab b{font-size:13px;font-weight:700;direction:ltr;white-space:nowrap}
.tab i{width:9px;height:9px;border-radius:50%;margin-bottom:3px}
.tab[data-d="1"] i{background:var(--p1)} .tab[data-d="2"] i{background:var(--p2)}
.tab[data-d="3"] i{background:var(--p3)} .tab[data-d="4"] i{background:var(--p4)}
.tab[data-d="cal"] i{background:transparent;border:2px solid var(--muted);border-radius:2px}
.tab[data-d="cal"][aria-selected="true"]{border-bottom-color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}

/* day head */
.dayhead{padding:18px 0 6px}
.dayhead h1{margin:0;font-size:30px;font-weight:800;line-height:1.2;direction:ltr;text-align:right}
.dayhead p{margin:2px 0 0;color:var(--muted);font-size:15px}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.dayprog{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:6px}
.dayprog span{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.intro{font-size:14px;color:var(--muted);margin:10px 0 0}

/* exercise */
.ex{background:var(--surface);border-radius:14px;padding:14px 14px 6px;margin:12px 0;
  border-inline-start:5px solid var(--acc)}
.ex-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ex-h .n{font-weight:800;color:var(--acc);font-size:18px;min-width:1.1em}
.ex-h h2{margin:0;font-size:18px;font-weight:700;line-height:1.4;direction:ltr;unicode-bidi:isolate}
.tag{font-size:12px;font-weight:700;background:var(--acc);color:var(--on-acc);border-radius:999px;padding:1px 9px}
.rx{margin:4px 0 0;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 14px}
.rx strong{color:var(--ink);font-weight:700}
.hint{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
.hint.good{color:var(--good);font-weight:700}
bdi{unicode-bidi:isolate}

.sets{margin-top:10px;border-top:1px solid var(--line)}
.set{padding:9px 0 10px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.set-l{font-size:13px;color:var(--muted);white-space:nowrap;min-width:38px}
.wt{display:flex;align-items:center;gap:5px;justify-self:start}
.wt input{width:68px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
  text-align:center;font-size:17px;font-weight:700;direction:ltr;-moz-appearance:textfield}
.wt input::-webkit-outer-spin-button,.wt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.wt input::placeholder{color:var(--low);font-weight:400}
.wt span{font-size:12px;color:var(--muted);direction:ltr}
.step{display:flex;align-items:center;gap:4px;direction:ltr}
.step button{width:44px;height:44px;border-radius:50%;border:2px solid var(--acc);background:transparent;
  font-size:24px;line-height:1;font-weight:500;display:grid;place-items:center;padding:0 0 2px;color:var(--ink)}
.step button.plus{background:var(--acc);color:var(--on-acc)}
.step button:active{transform:scale(.94)}
.step output{min-width:46px;text-align:center;font-size:24px;font-weight:800;line-height:1}
.step output.empty{color:var(--low);font-weight:400}
.step output.top{color:var(--good)}

.ladder{display:flex;gap:2px;margin-top:8px;align-items:center}
.ladder i{flex:1;height:8px;border-radius:2px;background:var(--track)}
.ladder i.rg{background:var(--range)}
.ladder i.on{background:var(--low)}
.ladder i.rg.on{background:var(--acc)}
.ladder em{font-style:normal;font-size:12px;font-weight:700;color:var(--good);margin-inline-start:4px;direction:ltr}

details{border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:10px 0;font-size:14px;color:var(--muted);
  display:flex;justify-content:space-between;align-items:center;min-height:44px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:18px;line-height:1}
details[open]>summary::after{content:"–"}
details.caution>summary{color:var(--warn);font-weight:700}
.note{font-size:14.5px;margin:0 0 10px;max-width:60ch}
.note.c{background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:8px 10px}
.alt{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.alt bdi{direction:ltr}

.bars{display:flex;align-items:flex-end;gap:4px;height:64px;margin:2px 0 4px;position:relative;
  border-top:1px dashed var(--good);direction:ltr}
.bars b{flex:1;max-width:26px;background:var(--acc);border-radius:3px 3px 0 0;min-height:3px}
.bars b.hit{background:var(--good)}
.cap{font-size:12px;color:var(--muted);margin:0 0 8px}
.hl{list-style:none;margin:0 0 12px;padding:0;font-size:14px}
.hl li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--line)}
.hl li:first-child{border-top:0}
.hl span{color:var(--muted);white-space:nowrap}
.empty-h{font-size:14px;color:var(--muted);margin:0 0 12px}

.cardio{background:transparent;border:1px dashed var(--range);border-inline-start:5px solid var(--range);padding-bottom:12px}
.cardio .set-row{margin-top:10px}
.editing{margin:10px 0 0;padding:8px 10px;border-radius:8px;background:var(--warn-bg);font-size:14px;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;padding:6px 14px;font-size:14px;font-weight:700}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 0 8px}
.calhead h1{margin:0;font-size:22px;font-weight:800;text-align:center;flex:1}
.calsub{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
.calsub button{border:0;background:transparent;color:var(--ink);text-decoration:underline;font-size:13px;min-height:44px;padding:0 4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border-radius:14px;padding:10px 8px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);padding-bottom:2px}
.cal button{border:1px solid transparent;background:transparent;border-radius:10px;aspect-ratio:1/1;min-height:42px;padding:2px 0 0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:500;line-height:1}
.cal button.has{font-weight:800;background:var(--bg)}
.cal button.fut{color:var(--low)}
.cal button.today{border-color:var(--muted)}
.cal button.sel{border:2px solid var(--ink)}
.cal .dots{display:flex;gap:2px;height:6px}
.cal .dots u{width:6px;height:6px;border-radius:50%}
.q1{background:var(--p1)} .q2{background:var(--p2)} .q3{background:var(--p3)} .q4{background:var(--p4)}
.dayinfo{background:var(--surface);border-radius:14px;padding:14px;margin:12px 0}
.dayinfo h2{margin:0;font-size:17px;font-weight:700}
.dayinfo h2 small{font-weight:400;color:var(--muted);font-size:13px;margin-inline-start:6px}
.dayinfo h3{margin:12px 0 2px;font-size:15px;font-weight:800;direction:ltr;text-align:right;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.dayinfo h3 u{width:9px;height:9px;border-radius:50%;display:inline-block}
.dayinfo .hl li{flex-wrap:wrap}
.dayinfo .hl li b{font-weight:500;direction:ltr;unicode-bidi:isolate}
.dayinfo .btn{margin-top:12px;width:100%}
.backup{margin:16px 0;font-size:13.5px;color:var(--muted)}
.backup div{display:flex;gap:8px;margin-top:8px}
.backup .btn{flex:1}
.foot{padding:8px 0 28px;font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-day="1">
<div class="top">
  <div class="wrap">
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
</div>
<main class="wrap" id="main"></main>
<div class="wrap foot" id="status" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ---------- برنامه ---------- */
const DAYS = [
 {d:1, name:"Lower A", sub:"باسن و همسترینگ", ex:[
  {id:"d1e1", name:"Hip Thrust Machine", sets:4, lo:6, hi:10, rir:"2", rest:"2–3 دقیقه", main:true,

   alt:"Smith Hip Thrust / Glute Bridge"},

  {id:"d1e3", name:"Leg Press", sets:3, lo:8, hi:12, rir:"2–3", rest:"2 دقیقه", caution:true,
   note:"پاها کمی بالاتر روی صفحه؛ عمق فقط تا جایی که زانو و سیاتیک راحت‌اند. لگن نباید در پایین حرکت از پد جدا و کمر گرد شود.",
   alt:"Hack Squat با دامنه بدون درد / Box Squat به شرط تحمل کامل"},
  {id:"d1e4", name:"Hip Abduction Machine", sets:3, lo:12, hi:18, rir:"1–2", rest:"60–75 ثانیه",
   note:"برای Glute medius و کناره باسن.", alt:"Cable Hip Abduction / Band Abduction"},
  {id:"d1e5", name:"Cable Pull-Through", sets:2, lo:10, hi:15, rir:"3", rest:"75–90 ثانیه", caution:true,
   note:"عمداً فقط ۲ ست، چون Hip Thrust و Leg Press قبلاً حجم قابل‌توجهی به باسن داده‌اند. اگر کوچک‌ترین تحریک سیاتیک ایجاد کرد، حذفش کن و Glute Bridge سبک بزن."},
  {id:"d1e6", name:"Pallof Press", sets:2, lo:10, hi:12, rir:"3", rest:"45–60 ثانیه", side:"هر طرف",
   note:"Core بدون کرانچ و خم‌کردن مکرر کمر."}
 ], cardio:{id:"d1c", lo:10, hi:15, text:"Walking متوسط، RPE حدود 5–6. روز پا دنبال رکورد شیب و سرعت نیستیم."}},

 {d:2, name:"Upper A", sub:"پشت، وضعیت بدن و دلتوئید پشتی",
  intro:"این روز مخصوصاً برای اولویتی که درباره حالت خمیده بالاتنه گفتی طراحی شده.", ex:[
  {id:"d2e1", name:"Chest-Supported Row", sets:4, lo:6, hi:10, rir:"2", rest:"2–3 دقیقه", main:true,
   note:"سینه روی پد می‌ماند، بنابراین می‌توانیم پشت را نسبتاً سنگین تمرین بدهیم بدون اینکه کمر مجبور شود وزنه را نگه دارد.",
   alt:"Machine Row / Seated Cable Row"},
  {id:"d2e2", name:"Neutral-Grip Lat Pulldown", sets:3, lo:8, hi:12, rir:"2", rest:"90–120 ثانیه",
   alt:"Assisted Pull-Up / Single-Arm Pulldown"},
  {id:"d2e3", name:"Machine Chest Press", sets:3, lo:8, hi:12, rir:"2", rest:"90–120 ثانیه",
   note:"Push را حذف نمی‌کنیم؛ فقط حجم Pull را کمی بیشتر نگه می‌داریم.", alt:"Incline DB Press / Cable Chest Press"},
  {id:"d2e4", name:"Reverse Pec Deck", sets:3, lo:12, hi:16, rir:"1–2", rest:"60–75 ثانیه",
   note:"Rear delts + upper back.", alt:"Cable Rear-Delt Fly / Face Pull"},
  {id:"d2e5", name:"Face Pull", sets:2, lo:12, hi:18, rir:"2", rest:"60 ثانیه",
   note:"اینجا هدف وزنه سنگین نیست؛ کنترل کتف و اجرای تمیز مهم‌تر است.", alt:"High Cable Row"},
  {id:"d2e6", name:"Dumbbell/Cable Lateral Raise", sets:2, lo:12, hi:18, rir:"1–2", rest:"60 ثانیه",
   note:"برای عرض و فرم سرشانه."},
  {id:"d2e7", name:"Rope Triceps Pressdown", sets:2, lo:10, hi:15, rir:"1–2", rest:"60 ثانیه",
   note:"می‌توانی با حرکت بعدی (جلو بازو) Superset کنی تا وقت نگیرد."},
  {id:"d2e8", name:"Cable/Dumbbell Biceps Curl", sets:2, lo:10, hi:15, rir:"1–2", rest:"60 ثانیه",
   note:"می‌توانی با حرکت قبلی (پشت بازو) Superset کنی."}
 ], cardio:{id:"d2c", lo:15, hi:20, text:"Walking متوسط، اگر انرژی داری."}},

 {d:3, name:"Lower B", sub:"چهارسر و باسن", intro:"این روز عمداً کپی روز ۱ نیست.", ex:[
  {id:"d3e1", name:"Leg Press", sets:4, lo:6, hi:10, rir:"2–3", rest:"2–3 دقیقه", main:true,
   note:"این بار Leg Press اول جلسه است تا وقتی تازه‌ای رویش Progressive Overload داشته باشیم."},
  {id:"d3e2", name:"Hip Thrust Machine", sets:3, lo:10, hi:12, rir:"2–3", rest:"90–120 ثانیه",
   note:"برخلاف روز ۱ که سنگین‌تر بود، اینجا وزنه کمتر و تکرار بالاتر."},
  {id:"d3e3", name:"Leg Extension", sets:2, lo:10, hi:15, rir:"3", rest:"75–90 ثانیه", caution:true,
   note:"این یکی مشروط است. اگر زانویت حین حرکت یا بعدش درد گرفت، قرار نیست تحملش کنی.",
   alt:"Leg Press سبک با دامنه راحت / Sit-to-Stand کنترل‌شده"},
  {id:"d3e4", name:"Lying / Seated Leg Curl", sets:3, lo:10, hi:15, rir:"2", rest:"75–90 ثانیه",
   note:"برای اینکه Hamstrings در روز دوم پا هم محرک بگیرد."},
  {id:"d3e5", name:"Hip Abduction", sets:2, lo:15, hi:20, rir:"1–2", rest:"60 ثانیه"},
  {id:"d3e6", name:"Cable Glute Kickback", sets:2, lo:12, hi:15, rir:"2", rest:"60 ثانیه", side:"هر پا", caution:true,
   note:"عمداً به‌جای Lunges/Bulgarian گذاشته شده. اگر ایستادن تک‌پا سیاتیک یا زانو را اذیت کرد، حذفش کن؛ Glute Bridge یا Abduction اضافه نکن، همین حجم کافی است."},
  {id:"d3e7", name:"Dead Bug", sets:2, lo:6, hi:10, side:"هر طرف",
   note:"آهسته و کنترل‌شده.", alt:"Bird Dog / Pallof Press"}
 ], cardio:{id:"d3c", lo:10, hi:15, text:"متوسط."}},

 {d:4, name:"Upper B", sub:"سرشانه، بازو و بالاتنه",
  intro:"اینجا نسبت به برنامه قبلی، بازو و سرشانه توجه مستقیم بیشتری می‌گیرند.", ex:[
  {id:"d4e1", name:"Incline Machine/DB Press", sets:3, lo:6, hi:10, rir:"2", rest:"2 دقیقه", main:true,
   alt:"Chest Press"},
  {id:"d4e2", name:"Seated Cable Row", sets:3, lo:8, hi:12, rir:"2", rest:"90–120 ثانیه", main:true,
   alt:"Machine Row / Chest-Supported Row"},
  {id:"d4e3", name:"Lat Pulldown", sets:3, lo:8, hi:12, rir:"2", rest:"90 ثانیه",
   note:"گریپ راحت و بدون تاب‌دادن بدن."},
  {id:"d4e4", name:"Machine Shoulder Press", sets:2, lo:8, hi:12, rir:"2–3", rest:"90 ثانیه", caution:true,
   note:"کمرت را برای بالا بردن وزنه گود نکن.", alt:"Landmine Press / High-Incline Machine Press"},
  {id:"d4e5", name:"Lateral Raise", sets:3, lo:12, hi:18, rir:"1–2", rest:"60 ثانیه"},
  {id:"d4e6", name:"Rope Triceps Pressdown", sets:3, lo:10, hi:15, rir:"1–2", rest:"60–75 ثانیه",
   note:"می‌توانی با Hammer Curl سوپرست کنی."},
  {id:"d4e7", name:"Hammer Curl", sets:3, lo:10, hi:15, rir:"1–2", rest:"60–75 ثانیه",
   note:"می‌توانی با Triceps Pressdown سوپرست کنی."},
  {id:"d4e8", name:"Reverse Pec Deck", sets:2, lo:12, hi:18, rir:"2", rest:"60 ثانیه",
   note:"برای اینکه Rear delt/upper back فقط یک بار در هفته تمرین مستقیم نداشته باشد."}
 ], cardio:{id:"d4c", lo:15, hi:20, text:"متوسط، در صورت تمایل."}}
];
const EX = {};
DAYS.forEach(function(day){ day.ex.forEach(function(e){ EX[e.id]=e; }); });

/* ---------- وضعیت و ذخیره‌سازی ---------- */
const LS_KEY = "gymlog.v1", LS_UI = "gymlog.ui";
let store = {};            // {exId:{sessions:{date:{sets:[{r,w}],t}}}}
let ui = {day:1, view:"day", date:null, cal:"persian", calAnchor:null, calSel:null, open:{}};
let cloud = null;          // {col} وقتی db در دسترس است
let cloudOff = false;

function lsGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
(function(){
  const s = lsGet(LS_KEY); if (s && typeof s==="object") store = s;
  const u = lsGet(LS_UI); if (u && u.day>=1 && u.day<=4) ui.day = u.day;
  if (u && (u.cal==="persian" || u.cal==="gregory")) ui.cal = u.cal;
})();

function pad(n){ return (n<10?"0":"")+n; }
function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayKey(){ return dateKey(new Date()); }
function curKey(){ return ui.date || todayKey(); }
function saveUi(){ lsSet(LS_UI,{day:ui.day,cal:ui.cal}); }
function keyToDate(k){ const p=k.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
let dfShort, dfLong;
try{
  dfShort = new Intl.DateTimeFormat("fa-IR-u-nu-latn",{day:"numeric",month:"long"});
  dfLong  = new Intl.DateTimeFormat("fa-IR-u-nu-latn",{weekday:"long",day:"numeric",month:"long"});
}catch(e){ dfShort = dfLong = {format:function(d){ return d.toLocaleDateString(); }}; }

function sessionsOf(id){ return (store[id] && store[id].sessions) || {}; }
function hasData(s){ return !!s && Array.isArray(s.sets) && s.sets.some(function(x){ return x && x.r!=null; }); }
function pastKeys(id){ // جلسه‌های قبل از امروز، جدیدترین اول
  const t=curKey(), ss=sessionsOf(id);
  return Object.keys(ss).filter(function(k){ return k<t && hasData(ss[k]); }).sort().reverse();
}
function allKeys(id){ const ss=sessionsOf(id); return Object.keys(ss).filter(function(k){ return hasData(ss[k]); }).sort(); }
function lastSession(id){ const k=pastKeys(id)[0]; return k?{key:k,s:sessionsOf(id)[k]}:null; }

function ensureToday(id, n){
  if (!store[id]) store[id]={sessions:{}};
  if (!store[id].sessions) store[id].sessions={};
  const t=curKey();
  let s=store[id].sessions[t];
  if (!s){
    const last=lastSession(id);
    s={sets:[],t:Date.now()};
    for (let i=0;i<n;i++){
      const pw = last && last.s.sets[i] ? last.s.sets[i].w : null;
      s.sets.push({r:null, w:(pw==null?null:pw)});
    }
    store[id].sessions[t]=s;
  }
  while (s.sets.length<n) s.sets.push({r:null,w:null});
  return s;
}

/* ---------- ذخیره ---------- */
const dirty = new Set(); let saveTimer=null, flushing=false;
const statusEl = document.getElementById("status");
function setStatus(t){ statusEl.textContent=t; }
function touch(id){
  store[id].sessions[curKey()].t = Date.now();
  const ok = lsSet(LS_KEY, store);
  dirty.add(id);
  clearTimeout(saveTimer); saveTimer=setTimeout(flush, 700);
  if (!cloud || cloudOff) setStatus(ok ? "روی همین گوشی ذخیره شد" : "ذخیره نشد؛ حافظه مرورگر در دسترس نیست");
  else setStatus("در حال ذخیره…");
}
async function flush(){
  if (!cloud || cloudOff){ dirty.clear(); return; }
  if (flushing) return;
  flushing=true;
  let failed=false;
  while (dirty.size && !cloudOff){
    const ids=Array.from(dirty); dirty.clear();
    for (const id of ids){
      const body={sessions: JSON.parse(JSON.stringify(sessionsOf(id)))};
      try{ await cloud.col.doc(id).set(body); }
      catch(e){
        const code = e && e.code;
        if (code==="unavailable"){
          try{ await new Promise(function(r){ setTimeout(r, 600+Math.random()*800); }); await cloud.col.doc(id).set(body); }
          catch(e2){ failed=true; }
        } else { failed=true; cloudOff=true; }
      }
    }
  }
  flushing=false;
  setStatus(failed ? "ذخیره در حساب انجام نشد؛ روی همین گوشی ذخیره است" : "ذخیره شد");
}

/* ---------- همگام‌سازی با حساب ---------- */
function mergeRemote(id, remote){
  if (!remote || typeof remote!=="object") return false;
  if (!store[id]) store[id]={sessions:{}};
  if (!store[id].sessions) store[id].sessions={};
  const local=store[id].sessions; let changed=false;
  Object.keys(remote).forEach(function(k){
    const r=remote[k]; if (!r || !Array.isArray(r.sets)) return;
    if (!local[k] || (r.t||0)>(local[k].t||0)){ local[k]=JSON.parse(JSON.stringify(r)); changed=true; }
  });
  return changed;
}
function localNewer(id, remote){
  const local=sessionsOf(id);
  return Object.keys(local).some(function(k){
    return hasData(local[k]) && (!remote || !remote[k] || (local[k].t||0)>(remote[k].t||0));
  });
}
async function initCloud(){
  if (!window.claude || typeof window.claude.use!=="function"){ setStatus("داده‌ها روی همین گوشی ذخیره می‌شوند"); return; }
  let db=null, user=null, uid=null;
  try{ db=await window.claude.use("db"); user=await window.claude.use("user"); uid=user?await user.id():null; }catch(e){}
  if (!db || !uid){ setStatus("داده‌ها روی همین گوشی ذخیره می‌شوند"); return; }
  let col;
  try{ col=db.collection("data/users/"+uid); }catch(e){ setStatus("داده‌ها روی همین گوشی ذخیره می‌شوند"); return; }
  cloud={col:col};
  let first=true;
  col.onSnapshot(function(snap){
    let changed=false; const seen={};
    snap.docs.forEach(function(doc){
      const data=doc.data(); const remote=data && data.sessions;
      seen[doc.id]=remote||{};
      if (mergeRemote(doc.id, remote)) changed=true;
    });
    if (changed) lsSet(LS_KEY, store);
    if (first){
      first=false;
      Object.keys(store).forEach(function(id){ if (localNewer(id, seen[id])) dirty.add(id); });
      if (dirty.size) flush(); else setStatus("با حساب Claude همگام است");
    }
    const a=document.activeElement;
    if (changed && !(a && a.tagName==="INPUT")) render();
  }, function(){ cloudOff=true; setStatus("اتصال به حساب قطع شد؛ روی همین گوشی ذخیره می‌شود"); });
}

/* ---------- نمایش ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function num(w){ return String(Math.round(w*100)/100); }
function fmtSets(sets){
  const done=sets.filter(function(x){ return x && x.r!=null; });
  if (!done.length) return "";
  const w0=done[0].w;
  const same=done.every(function(x){ return x.w===w0; });
  if (same) return (w0!=null ? num(w0)+" kg × " : "")+done.map(function(x){ return x.r; }).join(" , ");
  return done.map(function(x){ return (x.w!=null?num(x.w)+"×":"")+x.r; }).join(" , ");
}
function allAtTop(e, s){
  if (!s) return false;
  for (let i=0;i<e.sets;i++){ const x=s.sets[i]; if (!x || x.r==null || x.r<e.hi) return false; }
  return true;
}
function ladder(e, r){
  let h='<div class="ladder" aria-hidden="true">';
  for (let i=1;i<=e.hi;i++) h+='<i class="'+(i>=e.lo?"rg":"")+(r!=null&&i<=r?" on":"")+'"></i>';
  if (r!=null && r>e.hi) h+='<em>+'+(r-e.hi)+'</em>';
  return h+'</div>';
}
function hintHtml(e){
  const today=sessionsOf(e.id)[curKey()], last=lastSession(e.id);
  if (allAtTop(e, today)) return '<p class="hint good">همه ست‌ها به '+e.hi+' رسید. جلسه بعد وزنه را کمی بیشتر کن.</p>';
  if (last){
    let t='دفعه قبل ('+esc(dfShort.format(keyToDate(last.key)))+'): <bdi dir="ltr">'+esc(fmtSets(last.s.sets))+'</bdi>';
    if (allAtTop(e, last.s)) t+=' — به سقف رسیده بودی؛ این جلسه وزنه سنگین‌تر.';
    return '<p class="hint">'+t+'</p>';
  }
  return '<p class="hint">هدف: همه ست‌ها را به '+e.hi+' تکرار برسان، بعد وزنه را بیشتر کن.</p>';
}
function historyHtml(e){
  const keys=allKeys(e.id);
  const key=e.id+":hist";
  let h='<details class="hist" data-open="'+key+'"'+(ui.open[key]?" open":"")+'><summary>تاریخچه ('+keys.length+' جلسه)</summary>';
  if (!keys.length){ h+='<p class="empty-h">هنوز چیزی ثبت نشده. بعد از اولین جلسه، روند تکرارها اینجا دیده می‌شود.</p>'; }
  else{
    const ss=sessionsOf(e.id), recent=keys.slice(-14);
    h+='<div class="bars" aria-hidden="true">';
    recent.forEach(function(k){
      const done=ss[k].sets.filter(function(x){ return x && x.r!=null; });
      const avg=done.reduce(function(a,x){ return a+x.r; },0)/done.length;
      const pct=Math.max(5,Math.min(100,Math.round(avg/e.hi*100)));
      h+='<b class="'+(allAtTop(e,ss[k])?"hit":"")+'" style="height:'+pct+'%"></b>';
    });
    h+='</div><p class="cap">میانگین تکرار هر جلسه؛ خط‌چین بالا = '+e.hi+' تکرار</p><ul class="hl">';
    keys.slice(-8).reverse().forEach(function(k){
      h+='<li><span>'+esc(dfShort.format(keyToDate(k)))+'</span><bdi dir="ltr">'+esc(fmtSets(ss[k].sets))+'</bdi></li>';
    });
    h+='</ul>';
  }
  return h+'</details>';
}
function exHtml(e, idx){
  const today=sessionsOf(e.id)[curKey()], last=lastSession(e.id);
  let h='<article class="ex" data-id="'+e.id+'"><div class="ex-h"><span class="n">'+idx+'</span><h2>'+esc(e.name)+'</h2>'+
    (e.main?'<span class="tag">حرکت اصلی</span>':'')+'</div>';
  h+='<p class="rx"><strong>'+e.sets+' ست × '+e.lo+'–'+e.hi+(e.side?' '+e.side:'')+'</strong>'+
    (e.rir?'<span>RIR '+e.rir+'</span>':'')+(e.rest?'<span>استراحت '+e.rest+'</span>':'')+'</p>';
  h+=hintHtml(e)+'<div class="sets">';
  for (let i=0;i<e.sets;i++){
    const x=today && today.sets[i] ? today.sets[i] : {r:null,w:null};
    const pw=last && last.s.sets[i] && last.s.sets[i].w!=null ? num(last.s.sets[i].w) : "وزنه";
    const cls=x.r==null?"empty":(x.r>=e.hi?"top":"");
    h+='<div class="set"><div class="set-row"><span class="set-l">ست '+(i+1)+'</span>'+
      '<label class="wt"><input type="number" inputmode="decimal" step="0.5" min="0" data-ex="'+e.id+'" data-set="'+i+
      '" value="'+(x.w!=null?num(x.w):"")+'" placeholder="'+pw+'" aria-label="وزنه ست '+(i+1)+' به کیلوگرم"><span>kg</span></label>'+
      '<div class="step"><button type="button" data-act="dec" data-ex="'+e.id+'" data-set="'+i+'" aria-label="یک تکرار کمتر">−</button>'+
      '<output class="'+cls+'" aria-label="تکرار ست '+(i+1)+'">'+(x.r==null?"–":x.r)+'</output>'+
      '<button type="button" class="plus" data-act="inc" data-ex="'+e.id+'" data-set="'+i+'" aria-label="یک تکرار بیشتر">+</button></div></div>'+
      ladder(e, x.r)+'</div>';
  }
  h+='</div>';
  if (e.note || e.alt){
    const key=e.id+":more";
    h+='<details class="more'+(e.caution?" caution":"")+'" data-open="'+key+'"'+(ui.open[key]?" open":"")+'><summary>'+
      (e.caution?"نکته ایمنی و توضیح":"توضیح و جایگزین")+'</summary>';
    if (e.note) h+='<p class="note'+(e.caution?" c":"")+'">'+esc(e.note)+'</p>';
    if (e.alt) h+='<p class="alt">جایگزین: <bdi>'+esc(e.alt)+'</bdi></p>';
    h+='</details>';
  }
  return h+historyHtml(e)+'</article>';
}
function cardioHtml(c){
  const today=sessionsOf(c.id)[curKey()];
  const r=today && today.sets[0] ? today.sets[0].r : null;
  return '<article class="ex cardio" data-id="'+c.id+'"><div class="ex-h"><h2>Treadmill</h2></div>'+
    '<p class="rx"><strong>'+c.lo+'–'+c.hi+' دقیقه</strong><span>'+esc(c.text)+'</span></p>'+
    '<div class="set-row"><span class="set-l">دقیقه</span><span></span>'+
    '<div class="step"><button type="button" data-act="dec" data-ex="'+c.id+'" data-set="0" aria-label="کمتر">−</button>'+
    '<output class="'+(r==null?"empty":(r>=c.lo?"top":""))+'">'+(r==null?"–":r)+'</output>'+
    '<button type="button" class="plus" data-act="inc" data-ex="'+c.id+'" data-set="0" aria-label="بیشتر">+</button></div></div></article>';
}
function dayCount(day){
  const t=curKey(); let done=0, total=0;
  day.ex.forEach(function(e){
    total+=e.sets; const s=sessionsOf(e.id)[t];
    if (s) for (let i=0;i<e.sets;i++) if (s.sets[i] && s.sets[i].r!=null) done++;
  });
  return {done:done,total:total};
}
function updateDayProg(){
  const day=DAYS[ui.day-1], c=dayCount(day);
  const el=document.getElementById("cnt"), bar=document.getElementById("bar");
  if (el) el.textContent=c.done+" از "+c.total+" ست ثبت شد";
  if (bar) bar.style.width=Math.round(c.done/c.total*100)+"%";
}
const mainEl=document.getElementById("main"), tabsEl=document.getElementById("tabs");
function renderTabs(){
  tabsEl.innerHTML=DAYS.map(function(d){
    return '<button type="button" class="tab" role="tab" data-d="'+d.d+'" aria-selected="'+(ui.view==="day" && d.d===ui.day)+'"><i></i><small>روز '+d.d+'</small><b>'+d.name+'</b></button>';
  }).join("")+'<button type="button" class="tab" role="tab" data-d="cal" aria-selected="'+(ui.view==="cal")+'"><i></i><small>ثبت‌ها</small><b>تقویم</b></button>';
}
function render(){
  const day=DAYS[ui.day-1];
  document.body.dataset.day=String(ui.day);
  renderTabs();
  if (ui.view==="cal"){ renderCal(); return; }
  const past = ui.date && ui.date!==todayKey();
  let h='<header class="dayhead"><h1>'+day.name+'</h1><p>'+esc(day.sub)+'</p>'+
    '<div class="meta"><span>'+esc(dfLong.format(keyToDate(curKey())))+'</span><span id="cnt"></span></div>'+
    '<div class="dayprog"><span id="bar"></span></div>'+
    (past?'<p class="editing"><span>در حال ثبت برای روز گذشته</span><button type="button" class="btn" data-cal="today">برگرد به امروز</button></p>':'')+
    (day.intro?'<p class="intro">'+esc(day.intro)+'</p>':'')+'</header>';
  day.ex.forEach(function(e,i){ h+=exHtml(e,i+1); });
  h+=cardioHtml(day.cardio);
  mainEl.innerHTML=h;
  updateDayProg();
}
function rerenderCard(id){
  if (ui.view!=="day") return;
  const el=mainEl.querySelector('.ex[data-id="'+id+'"]'); if (!el) return;
  const day=DAYS[ui.day-1];
  if (day.cardio.id===id){ el.outerHTML=cardioHtml(day.cardio); }
  else{ const i=day.ex.findIndex(function(e){ return e.id===id; }); if (i<0) return; el.outerHTML=exHtml(day.ex[i], i+1); }
  updateDayProg();
}

/* ---------- تقویم ---------- */
const calFmts={};
function calParts(d, cal){
  if (!calFmts[cal]) calFmts[cal]=new Intl.DateTimeFormat("en-u-ca-"+cal+"-nu-latn",{year:"numeric",month:"numeric",day:"numeric"});
  const o={};
  calFmts[cal].formatToParts(d).forEach(function(p){ if (p.type==="month"||p.type==="day") o[p.type]=parseInt(p.value,10); });
  return o;
}
function calName(){
  if (ui.cal==="persian"){
    try{ const p=calParts(new Date(2026,2,21,12),"persian"); if (p.day===1 && p.month===1) return "persian"; }catch(e){}
    return "gregory";
  }
  return "gregory";
}
function addDays(d,n){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,12); }
function monthDays(anchor, cal){
  const a=new Date(anchor.getFullYear(),anchor.getMonth(),anchor.getDate(),12);
  const p=calParts(a,cal); let d=addDays(a,-(p.day-1)); const out=[];
  for (let i=0;i<32;i++){ const q=calParts(d,cal); if (q.month!==p.month) break; out.push({date:d,day:q.day}); d=addDays(d,1); }
  return out;
}
function dateIndex(){
  const idx={};
  Object.keys(store).forEach(function(id){
    const m=/^d([1-4])/.exec(id); if (!m) return;
    const ss=sessionsOf(id);
    Object.keys(ss).forEach(function(k){
      if (!hasData(ss[k])) return;
      if (!idx[k]) idx[k]={};
      idx[k][m[1]]=true;
    });
  });
  return idx;
}
function dayInfoHtml(k, idx){
  const today=todayKey(), d=keyToDate(k);
  let greg=""; try{ greg=new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",year:"numeric"}).format(d); }catch(e){}
  let h='<section class="dayinfo"><h2>'+esc(dfLong.format(d))+'<small dir="ltr">'+esc(greg)+'</small></h2>';
  const progs=idx[k];
  if (!progs){ h+='<p class="empty-h" style="margin:8px 0 0">'+(k>today?"این روز هنوز نرسیده.":"برای این روز تمرینی ثبت نشده.")+'</p>'; }
  else{
    DAYS.forEach(function(day){
      if (!progs[day.d]) return;
      h+='<h3>'+esc(day.name)+'<u class="q'+day.d+'"></u></h3><ul class="hl">';
      day.ex.forEach(function(e){
        const s=sessionsOf(e.id)[k]; if (!hasData(s)) return;
        h+='<li><b>'+esc(e.name)+'</b><bdi dir="ltr">'+esc(fmtSets(s.sets))+'</bdi></li>';
      });
      const c=sessionsOf(day.cardio.id)[k];
      if (hasData(c)) h+='<li><b>Treadmill</b><span>'+c.sets[0].r+' دقیقه</span></li>';
      h+='</ul>';
    });
  }
  if (k<=today) h+='<button type="button" class="btn pri" data-cal="edit">'+(progs?"ویرایش این روز":(k===today?"شروع تمرین امروز":"ثبت تمرین برای این روز"))+'</button>';
  return h+'</section>';
}
function backupHtml(){
  if (window.claude) return "";
  return '<section class="backup">ثبت‌ها فقط روی همین گوشی ذخیره می‌شوند. هر چند وقت یک بار پشتیبان بگیر تا با پاک شدن داده‌های مرورگر از دست نروند.'+
    '<div><button type="button" class="btn" data-cal="export">گرفتن پشتیبان</button>'+
    '<button type="button" class="btn" data-cal="import">برگرداندن پشتیبان</button></div>'+
    '<input type="file" id="imp" accept="application/json,.json" hidden></section>';
}
function renderCal(){
  const cal=calName(), today=todayKey();
  const anchor=ui.calAnchor || new Date();
  const days=monthDays(anchor, cal), idx=dateIndex();
  if (!ui.calSel) ui.calSel=today;
  let title="";
  try{ title=new Intl.DateTimeFormat("fa-IR-u-ca-"+cal+"-nu-latn",{month:"long",year:"numeric"}).format(days[0].date); }catch(e){ title=days[0].date.toLocaleDateString(); }
  const wd = cal==="persian" ? ["ش","ی","د","س","چ","پ","ج"] : ["د","س","چ","پ","ج","ش","ی"];
  const firstCol = cal==="persian" ? (days[0].date.getDay()+1)%7 : (days[0].date.getDay()+6)%7;
  let trained=0;
  let grid='';
  wd.forEach(function(w){ grid+='<span class="wd">'+w+'</span>'; });
  for (let i=0;i<firstCol;i++) grid+='<span></span>';
  days.forEach(function(x){
    const k=dateKey(x.date), pr=idx[k]; if (pr) trained++;
    let dots='';
    if (pr) ["1","2","3","4"].forEach(function(n){ if (pr[n]) dots+='<u class="q'+n+'"></u>'; });
    grid+='<button type="button" data-cal="sel" data-k="'+k+'" class="'+(pr?"has ":"")+(k===today?"today ":"")+(k>today?"fut ":"")+(k===ui.calSel?"sel":"")+
      '" aria-label="'+esc(dfShort.format(x.date))+(pr?"، تمرین ثبت شده":"")+'"'+(k===ui.calSel?' aria-pressed="true"':'')+'>'+x.day+'<span class="dots">'+dots+'</span></button>';
  });
  mainEl.innerHTML='<div class="calhead"><button type="button" class="btn" data-cal="prev">ماه قبل</button><h1>'+esc(title)+'</h1>'+
    '<button type="button" class="btn" data-cal="next">ماه بعد</button></div>'+
    '<div class="calsub"><span>'+trained+' روز تمرین در این ماه</span><button type="button" data-cal="toggle">'+(cal==="persian"?"نمایش میلادی":"نمایش شمسی")+'</button></div>'+
    '<div class="cal">'+grid+'</div>'+dayInfoHtml(ui.calSel, idx)+backupHtml();
}
function calAction(b){
  const act=b.dataset.cal, cal=calName();
  if (act==="today"){ ui.date=null; render(); return; }
  if (act==="sel"){ ui.calSel=b.dataset.k; renderCal(); return; }
  if (act==="prev" || act==="next"){
    const days=monthDays(ui.calAnchor || new Date(), cal);
    ui.calAnchor = act==="prev" ? addDays(days[0].date,-1) : addDays(days[days.length-1].date,1);
    renderCal(); return;
  }
  if (act==="toggle"){ ui.cal = cal==="persian" ? "gregory" : "persian"; saveUi(); renderCal(); return; }
  if (act==="edit"){
    const k=ui.calSel || todayKey(); if (k>todayKey()) return;
    const pr=dateIndex()[k];
    if (pr){ for (let n=1;n<=4;n++){ if (pr[n]){ ui.day=n; break; } } }
    ui.date = k===todayKey() ? null : k; ui.view="day"; saveUi(); render(); window.scrollTo(0,0); return;
  }
  if (act==="export"){ exportBackup(); return; }
  if (act==="import"){ const f=document.getElementById("imp"); if (f) f.click(); return; }
}
async function exportBackup(){
  const name="gym-backup-"+todayKey()+".json", json=JSON.stringify({app:"gymlog",v:1,store:store});
  try{
    const file=new File([json], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); setStatus("پشتیبان آماده شد"); return; }
  }catch(e){ if (e && e.name==="AbortError") return; }
  try{
    const url=URL.createObjectURL(new Blob([json],{type:"application/json"}));
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    setStatus("فایل پشتیبان دانلود شد");
  }catch(e){ setStatus("گرفتن پشتیبان در این مرورگر ممکن نشد"); }
}
function importBackup(file){
  const rd=new FileReader();
  rd.onload=function(){
    try{
      const o=JSON.parse(String(rd.result)); const st=o && o.store;
      if (!st || typeof st!=="object") throw new Error("bad");
      Object.keys(st).forEach(function(id){ if (/^d[1-4](e\d|c)$/.test(id) && st[id]) mergeRemote(id, st[id].sessions); });
      lsSet(LS_KEY, store); render(); setStatus("پشتیبان برگردانده شد");
    }catch(e){ setStatus("این فایل پشتیبانِ این اپ نیست"); }
  };
  rd.onerror=function(){ setStatus("خواندن فایل ممکن نشد"); };
  rd.readAsText(file);
}

/* ---------- رویدادها ---------- */
tabsEl.addEventListener("click", function(ev){
  const b=ev.target.closest(".tab"); if (!b) return;
  if (b.dataset.d==="cal"){ ui.view="cal"; ui.calSel=curKey(); ui.calAnchor=keyToDate(curKey()); }
  else { ui.view="day"; ui.day=+b.dataset.d; saveUi(); }
  render(); window.scrollTo(0,0);
});
mainEl.addEventListener("click", function(ev){
  const cb=ev.target.closest("button[data-cal]"); if (cb){ calAction(cb); return; }
  const b=ev.target.closest("button[data-act]"); if (!b) return;
  const id=b.dataset.ex, i=+b.dataset.set, inc=b.dataset.act==="inc";
  const day=DAYS[ui.day-1], isCardio=day.cardio.id===id;
  const def=isCardio?day.cardio:EX[id]; if (!def) return;
  const n=isCardio?1:def.sets, stepBy=isCardio?5:1;
  const last=lastSession(id);
  const s=ensureToday(id, n), x=s.sets[i];
  if (x.r==null){
    const prev=last && last.s.sets[i] ? last.s.sets[i].r : null;
    x.r = prev!=null ? prev : def.lo;
  } else {
    x.r = x.r + (inc?stepBy:-stepBy);
    if (x.r<=0) x.r=null;
    else if (x.r>199) x.r=199;
  }
  touch(id); rerenderCard(id);
  const again=mainEl.querySelector('button[data-act="'+b.dataset.act+'"][data-ex="'+id+'"][data-set="'+i+'"]');
  if (again) again.focus({preventScroll:true});
});
function readWeight(inp){
  const id=inp.dataset.ex, i=+inp.dataset.set, e=EX[id]; if (!e) return null;
  const raw=inp.value.trim().replace(",",".");
  let v=raw===""?null:parseFloat(raw);
  if (v!=null && (!isFinite(v) || v<0)) v=null;
  if (v!=null && v>999) v=999;
  const s=ensureToday(id, e.sets);
  if (s.sets[i].w===v) return null;
  s.sets[i].w=v;
  // وزنه ست‌های بعدی که هنوز خالی‌اند را هم پر کن
  for (let j=i+1;j<e.sets;j++){ if (s.sets[j].r==null && v!=null) s.sets[j].w=v; }
  touch(id);
  return id;
}
mainEl.addEventListener("change", function(ev){
  const inp=ev.target;
  if (inp.id==="imp"){ if (inp.files && inp.files[0]) importBackup(inp.files[0]); inp.value=""; return; }
  if (!(inp.matches && inp.matches("input[data-ex]"))) return;
  const id=readWeight(inp); if (id) rerenderCard(id);
});
mainEl.addEventListener("toggle", function(ev){
  const d=ev.target; if (d.dataset && d.dataset.open) ui.open[d.dataset.open]=d.open;
}, true);
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState==="hidden"){ clearTimeout(saveTimer); flush(); }
});

render();
initCloud();
if (!window.claude && "serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
</script>
